name: Deploy to AKS

on:
  push:
    branches:
      - main

env:
  RESOURCE_GROUP: rg-booking-app
  AKS_CLUSTER: aks-booking-app
  ACR_NAME: acrgreatbookingapp
  ACR_LOGIN_SERVER: acrgreatbookingapp.azurecr.io
  IMAGE_NAME: azure-booking-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: true

      - name: Deploy to AKS
        run: |
          IMAGE_TAG=${{ github.sha }}
          sed -i "s|acrgreatbookingapp.azurecr.io/azure-booking-app:latest|$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG|g" aks-deployment.yaml
          kubectl apply -f aks-deployment.yaml